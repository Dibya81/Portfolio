<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Dibya Bhusal</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #080808;
      color: #f3f3f3;
    }
    .error-card {
      max-width: 480px;
      padding: 48px 36px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 5rem;
      font-weight: 800;
      color: var(--accent, #c8ff00);
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -0.05em;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      background: var(--accent, #c8ff00);
      color: #0a0a0a;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(200, 255, 0, 0.4);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The coordinates you navigated to do not exist or have been shifted in hyperspace.</p>
    <a href="./index.html" class="home-btn">← Back to Portfolio</a>
  </div>
</body>
</html>
